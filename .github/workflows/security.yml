name: Dependency security
on:
  push:
    branches: [main, tauri-migration]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: moderate
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Check shipped Mac and Windows dependencies
        run: cargo audit --file src-tauri/Cargo.lock --target-os macos --target-os windows --target-arch aarch64 --target-arch x86_64
