name: Publish universal macOS installer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: universal-macos-release
  cancel-in-progress: false
jobs:
  universal:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Build explicitly unsigned universal DMG
        run: npm run dist:mac:unsigned:universal -- --publish never
      - name: Verify both architectures and disk image
        run: |
          npm run verify:universal -- "dist/mac-universal/Кружок.app"
          VERSION=$(node -p 'require("./package.json").version')
          hdiutil verify "dist/installers/mac-universal/Кружок-${VERSION}.dmg"
      - name: Publish installer and add checksum to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          RELEASE_TAG="v${VERSION}"
          ASSET="Kruzhok-${VERSION}-mac-universal.dmg"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          mkdir -p release-assets
          cp "dist/installers/mac-universal/Кружок-${VERSION}.dmg" "release-assets/$ASSET"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir release-assets
          if grep -qF "$ASSET" release-assets/SHA256SUMS; then
            echo 'Universal checksum already exists; refusing to overwrite a released installer.' >&2
            exit 1
          fi
          (cd release-assets && shasum -a 256 "$ASSET" >> SHA256SUMS)
          gh release upload "$RELEASE_TAG" "release-assets/$ASSET" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          cat release-assets/SHA256SUMS
