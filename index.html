<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
  <title>Floating Camera</title>
  <style>
    :root { --shadow-inset: 44px; color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
    body { box-sizing: border-box; container-type: size; transition: padding 240ms cubic-bezier(.2, .8, .2, 1); }
    body.shadow-enabled { padding: var(--shadow-inset); }
    button { font: inherit; }
    .circle { position: relative; width: 100%; height: 100%; overflow: hidden; box-sizing: border-box; border: 3px solid #fff; border-radius: 50%; background: #141414; cursor: grab; user-select: none; contain: layout paint; will-change: border-radius, box-shadow; transform: translateZ(0); transition: border-radius 240ms cubic-bezier(.2, .8, .2, 1), border-width 180ms ease, box-shadow 240ms ease; }
    .circle:active { cursor: grabbing; }
    .circle.locked { cursor: default; }
    .circle.rectangle { corner-shape: superellipse(1.5); }
    .circle.rectangle[data-aspect-ratio="1:1"] { border-radius: 28.571cqh; }
    .circle.rectangle[data-aspect-ratio="4:5"] { border-radius: 28.571cqh; }
    .circle.rectangle[data-aspect-ratio="9:16"] { border-radius: 20cqh; }
    body.shadow-enabled .circle { box-shadow: 0 10px 28px rgba(0, 0, 0, .38), 0 2px 8px rgba(0, 0, 0, .22); }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; transform: translateZ(0); }
    video.mirror { transform: scaleX(-1); }
    .scrim { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(transparent 55%, rgba(0, 0, 0, .32)); }
    .error[hidden] { display: none; }
    .error { position: absolute; z-index: 2; inset: auto 10px 10px; display: grid; gap: 7px; padding: 9px; border-radius: 10px; background: rgba(118, 20, 20, .94); color: #fff; font-size: 12px; line-height: 1.3; cursor: default; }
    .error-actions { display: flex; gap: 6px; }
    .error button { flex: 1; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; background: rgba(0,0,0,.24); color: #fff; padding: 5px; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) {
      body, .circle { transition-duration: 0ms !important; }
    }
  </style>
</head>
<body>
  <main id="circle" class="circle" aria-label="Плавающее окно камеры">
    <video id="cam" autoplay playsinline muted aria-label="Видео с камеры"></video>
    <div class="scrim"></div>
    <aside id="err" class="error" hidden aria-live="assertive">
      <span id="errText"></span>
      <div class="error-actions">
        <button id="retryButton" type="button">Повторить</button>
        <button id="privacyButton" type="button" hidden>Настройки macOS</button>
      </div>
    </aside>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
