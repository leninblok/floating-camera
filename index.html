<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Camera</title>
  <style>
    :root {
      color-scheme: light only;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent; /* critical for transparent window */
      overflow: hidden;
    }
    /* Main circular container: custom JS handles dragging */
    .circle {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      /* subtle translucent border */
      box-sizing: border-box;
      border: 2px solid rgba(255, 255, 255, 1);
      backdrop-filter: none; /* keeps it simple and performant */
      cursor: default;
    }
    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 0;
    }
    /* When enlarged, disable dragging */
    .circle.locked {
      cursor: default;
    }
    video {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
      display: block;
      pointer-events: none; /* do not block dragging */
    }
    /* Close button (non-draggable) */
    .close-btn {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 14px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      padding: 0;
      outline: none;
    }
    .close-btn:hover { background: rgba(0,0,0,0.75); }
    .error {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      -webkit-app-region: no-drag;
      display: none;
    }
  </style>
</head>
<body>
  <div class="circle" id="circle">
    <div class="backdrop"></div>
    <video id="cam" autoplay playsinline muted></video>
    <div id="err" class="error"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
